name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests + build APKs
        run: chmod +x gradlew && ./gradlew :finapp:testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NotifLog-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Finance-apk
          path: finapp/build/outputs/apk/debug/finapp-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: finapp/build/reports/tests/
